# Security gates for any repository: workflow lint + secret scan of new commits.
# Copy to <project>/.github/workflows/security.yml and adjust the branch list.
#
# - actionlint lints every workflow (shellcheck included). It catches script injection such as
#   ${{ github.head_ref }} written straight into a run: script. Pass untrusted values through
#   env: instead, as the secret-scan step below does.
# - gitleaks scans only the commits each pull request or push adds, so old history does not block
#   every PR. A full-history scan is a one-off cleanup, run by hand (workflow_dispatch, report only).
# - Pin third-party actions to a full commit SHA with the tag in a trailing comment, so a moved or
#   hijacked tag cannot change what runs. The <FULL_COMMIT_SHA> values are placeholders: look up the
#   current release's commit SHA for each action and pin it; let Dependabot propose updates.
# - Downloaded tools are checksum-verified. No job needs a secret; permissions are read-only.

name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_secret_scan:
        description: Scan the whole git history for secrets (report only) instead of just the new commits
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash  # bash -eo pipefail: a failing command in a pipe fails the step

jobs:
  workflow-lint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@<FULL_COMMIT_SHA> # vX.Y.Z
        with:
          persist-credentials: false
      - name: Install actionlint (checksum-verified)
        env:
          V: '<ACTIONLINT_VERSION>'
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${V}"
          curl -sSfL -o "actionlint_${V}_linux_amd64.tar.gz" "${base}/actionlint_${V}_linux_amd64.tar.gz"
          curl -sSfL -o checksums.txt "${base}/actionlint_${V}_checksums.txt"
          grep " actionlint_${V}_linux_amd64.tar.gz\$" checksums.txt | sha256sum -c -
          tar -xzf "actionlint_${V}_linux_amd64.tar.gz" actionlint
      - name: Lint .github/workflows
        run: ./actionlint -color

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@<FULL_COMMIT_SHA> # vX.Y.Z
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        env:
          V: '<GITLEAKS_VERSION>'
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          curl -sSfL -o "gitleaks_${V}_linux_x64.tar.gz" "${base}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz\$" checksums.txt | sha256sum -c -
          tar -xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
      - name: Scan the commits this run adds
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          FULL: ${{ inputs.full_secret_scan }}
        run: |
          exit_code=1
          if [ "$FULL" = "true" ]; then
            range=""; exit_code=0
          elif [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && [[ ! "$PUSH_BEFORE" =~ ^0+$ ]] \
              && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${GITHUB_SHA}"
          else
            range="${GITHUB_SHA}~1..${GITHUB_SHA}"
          fi
          echo "Scanning: ${range:-entire history (report only)}" | tee -a "$GITHUB_STEP_SUMMARY"
          args=(git --no-banner --redact --report-format json --report-path gitleaks-report.json --exit-code "$exit_code")
          if [ -n "$range" ]; then args+=("--log-opts=${range}"); fi
          ./gitleaks "${args[@]}" .
      - name: Upload the findings (values redacted)
        if: failure() || inputs.full_secret_scan
        uses: actions/upload-artifact@<FULL_COMMIT_SHA> # vX.Y.Z
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 14
          if-no-files-found: ignore
