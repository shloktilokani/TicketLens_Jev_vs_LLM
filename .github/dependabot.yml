# Dependabot version updates: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
# GitHub reads this file only from the default branch (main), and opens its PRs against main.
# There is no CI: run the checks in CLAUDE.md locally before merging a Dependabot PR.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend" # requirements.txt holds the pins; pyproject.toml is tool config only
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7 # skip releases younger than a week, so a bad or hijacked release is usually caught first
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directories: ["/frontend", "/e2e"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint 8.x supports only TypeScript below 6.1 (PROGRESS.md, Phase 1 notes).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
