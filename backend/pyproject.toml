# Tool configuration only. Dependencies live in requirements.txt, as the project spec names it.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# C90 and SIM support the code-size rules in .context/code-size-standards.md.
select = ["E", "F", "I", "B", "UP", "C90", "SIM"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# An HTML/CSS template: wrapping its markup would make it harder to read, not easier.
"app/services/run_report.py" = ["E501"]
